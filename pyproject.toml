[project]
name = "osmpoicms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osmpoicms"]

[tool.uv.scripts]
dev = "uvicorn osmpoicms.main:app --reload --ssl-keyfile=localhost-key.pem --ssl-certfile=localhost.pem"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
