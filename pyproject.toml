[project]
name = "osmpoicms"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osmpoicms"]

[project.scripts]
dev = "osmpoicms.main:dev"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
