<!DOCTYPE html>
<html lang="{{ lang | default('en') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenStreetMap POI Editor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/theme.css" rel="stylesheet">
</head>
<body>
  <main>{% block body %}{% endblock %}</main>
  <footer>
    <div>
      {% if lang == 'de' %}<strong>Deutsch</strong>{% else %}<a href="/set-lang?lang=de">Deutsch</a>{% endif %}
      &nbsp;|&nbsp;
      {% if lang == 'en' %}<strong>English</strong>{% else %}<a href="/set-lang?lang=en">English</a>{% endif %}
    </div>
    <div class="mt-1">
      <a href="https://github.com/antonpirker/osmpoicms/" target="_blank">github.com/antonpirker/osmpoicms</a>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
