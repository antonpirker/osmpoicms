{% extends "base.html" %}
{% block body %}
{% include "_navbar.html" %}

<div class="container mt-4" style="max-width: 640px;">
  <form method="post" action="/pois" id="poi-form">

    <div class="mb-4">
      <label class="form-label fw-semibold">{{ t.dashboard_community_label }}</label>
      <div class="position-relative">
        <input type="text" id="community-input" class="form-control pe-5"
               placeholder="{{ t.dashboard_community_placeholder }}" autocomplete="off"
               value="{{ prefill_community_name }}">
        <button type="button" id="community-clear"
                class="position-absolute top-50 end-0 translate-middle-y me-2 btn btn-sm btn-link p-0 text-muted text-decoration-none d-none"
                tabindex="-1" style="box-shadow:none; line-height:1;">✕</button>
        <span id="community-spinner"
              class="position-absolute top-50 end-0 translate-middle-y me-2 d-none">
          <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
        </span>
        <ul id="community-dropdown" class="dropdown-menu w-100" style="max-height: 200px; overflow-y: auto;"></ul>
      </div>
      <input type="hidden" name="community_id" id="community-id" value="{{ prefill_community_id }}">
      <input type="hidden" name="community_name" id="community-name" value="{{ prefill_community_name }}">
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">{{ t.dashboard_category_label }}</label>
      <div class="row row-cols-2 g-2">
        {% for value, label in categories %}
        <div class="col">
          <div class="form-check">
            <input class="form-check-input category-radio" type="radio"
                   name="category" id="cat-{{ value }}" value="{{ value }}">
            <label class="form-check-label" for="cat-{{ value }}">{{ t["category_" ~ value] }}</label>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <button type="submit" id="load-btn" class="btn btn-primary" disabled>
      <span id="load-spinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
      <span id="load-label">{{ t.dashboard_load_btn }}</span>
    </button>

  </form>
</div>

<script>
  const communityInput   = document.getElementById('community-input');
  const dropdown         = document.getElementById('community-dropdown');
  const communityId      = document.getElementById('community-id');
  const communityName    = document.getElementById('community-name');
  const loadBtn          = document.getElementById('load-btn');
  const communitySpinner = document.getElementById('community-spinner');
  const communityClear   = document.getElementById('community-clear');
  const loadingText      = {{ t.dashboard_load_btn_loading | tojson }};

  function checkReady() {
    loadBtn.disabled = !(communityId.value && document.querySelector('.category-radio:checked'));
    communityClear.classList.toggle('d-none', !communityInput.value);
  }

  communityClear.addEventListener('click', () => {
    communityInput.value = '';
    communityId.value = '';
    communityName.value = '';
    closeDropdown();
    checkReady();
    communityInput.focus();
  });

  document.querySelectorAll('.category-radio').forEach(r => r.addEventListener('change', checkReady));

  document.getElementById('poi-form').addEventListener('submit', () => {
    loadBtn.disabled = true;
    document.getElementById('load-spinner').classList.remove('d-none');
    document.getElementById('load-label').textContent = loadingText;
  });

  // Restore pre-selected category and initial button state
  const prefillCategory = {{ prefill_category | tojson }};
  if (prefillCategory) {
    const radio = document.getElementById('cat-' + prefillCategory);
    if (radio) radio.checked = true;
  }
  checkReady();

  let debounce;
  communityInput.addEventListener('input', () => {
    communityId.value = '';
    communityName.value = '';
    checkReady();
    clearTimeout(debounce);
    const q = communityInput.value.trim();
    if (q.length < 2) { closeDropdown(); return; }
    debounce = setTimeout(async () => {
      communityClear.classList.add('d-none');
      communitySpinner.classList.remove('d-none');
      try {
        const res   = await fetch('/api/communities?q=' + encodeURIComponent(q));
        const items = await res.json();
        if (!items.length) { closeDropdown(); return; }
        dropdown.innerHTML = items.map(c =>
          `<li><a class="dropdown-item" href="#" data-id="${c.id}" data-name="${c.name}">${c.name}</a></li>`
        ).join('');
        dropdown.classList.add('show');
      } finally {
        communitySpinner.classList.add('d-none');
        checkReady();
      }
    }, 300);
  });

  function selectItem(a) {
    communityId.value    = a.dataset.id;
    communityName.value  = a.dataset.name;
    communityInput.value = a.dataset.name;
    closeDropdown();
    checkReady();
  }

  dropdown.addEventListener('click', e => {
    e.preventDefault();
    const a = e.target.closest('[data-id]');
    if (a) selectItem(a);
  });

  communityInput.addEventListener('keydown', e => {
    const items = dropdown.querySelectorAll('[data-id]');
    if (!items.length) return;
    const active = dropdown.querySelector('.active');
    const idx    = Array.from(items).indexOf(active);

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = items[idx + 1] ?? items[0];
      active?.classList.remove('active');
      next.classList.add('active');
      next.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = items[idx - 1] ?? items[items.length - 1];
      active?.classList.remove('active');
      prev.classList.add('active');
      prev.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) selectItem(active);
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });

  document.addEventListener('click', e => {
    if (!communityInput.contains(e.target) && !dropdown.contains(e.target)) closeDropdown();
  });

  function closeDropdown() {
    dropdown.innerHTML = '';
    dropdown.classList.remove('show');
  }
</script>
{% endblock %}
