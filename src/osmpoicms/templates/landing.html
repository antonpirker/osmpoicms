{% extends "base.html" %}
{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="text-center">
    {% if error == "auth_failed" %}
    <div class="alert alert-danger mb-4">{{ t.landing_auth_failed }}</div>
    {% endif %}
    <h1 class="mb-2">OpenStreetMap POI Editor</h1>
    <p class="text-muted mb-4">{{ t.landing_tagline }}</p>
    <a href="/auth/login" class="btn btn-primary btn-lg">
      {{ t.landing_connect_btn }}
    </a>
  </div>
</div>
{% endblock %}
