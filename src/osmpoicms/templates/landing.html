{% extends "base.html" %}
{% block body %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="text-center">
    {% if error == "auth_failed" %}
    <div class="alert alert-danger mb-4">Authentication failed. Please try again.</div>
    {% endif %}
    <h1 class="mb-2">OSM POI CMS</h1>
    <p class="text-muted mb-4">Manage POI data for Austrian municipalities on OpenStreetMap.</p>
    <a href="/auth/login" class="btn btn-primary btn-lg">
      Connect to my OpenStreetMap.org account
    </a>
  </div>
</div>
{% endblock %}
